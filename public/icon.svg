<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glow circle in center -->
  <circle cx="256" cy="256" r="140" fill="url(#accent)" opacity="0.15" filter="url(#glow)" />

  <!-- Calendar Outer Frame -->
  <rect x="116" y="128" width="280" height="260" rx="36" fill="#27272a" stroke="#3f3f46" stroke-width="6"/>
  
  <!-- Calendar Top Header -->
  <path d="M 116 164 Q 116 128 152 128 L 360 128 Q 396 128 396 164 L 396 196 L 116 196 Z" fill="url(#accent)"/>

  <!-- Calendar Binder Rings -->
  <rect x="180" y="104" width="20" height="44" rx="10" fill="#f4f4f5"/>
  <rect x="312" y="104" width="20" height="44" rx="10" fill="#f4f4f5"/>

  <!-- Clock & Milestone graphic inside calendar -->
  <circle cx="256" cy="288" r="64" fill="#18181b" stroke="url(#accent)" stroke-width="6"/>
  <path d="M 256 250 L 256 288 L 282 288" stroke="#f4f4f5" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Star sparkle -->
  <polygon points="340,230 346,242 358,244 349,253 351,265 340,259 329,265 331,253 322,244 334,242" fill="#fbbf24"/>
  
  <!-- MIRAZ Creator Signature Mark -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#a1a1aa" letter-spacing="4">BY MIRAZ</text>
</svg>
